name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      # Harness rc.6 was released less than pnpm's default package-age window
      # ago. Every dependency remains exact-lockfile and integrity verified.
      - run: pnpm install --frozen-lockfile --config.minimum-release-age=0
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run pack:check
      - run: pnpm audit --prod
